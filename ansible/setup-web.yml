---
- name: Configure Backend Server (Instance 2)
  hosts: backend
  become: yes
  vars_files:
    - tf_vars.yml
  tasks:
    - name: Update apt and install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Create identification page on Instance 2
      shell: echo "<h1>Success! This is Instance 2 (Backend Server)</h1>" > /var/www/html/index.nginx-debian.html

- name: Configure Reverse Proxy (Instance 1)
  hosts: proxy
  become: yes
  vars_files:
    - tf_vars.yml
  tasks:
    - name: Update apt and install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Remove default Nginx config to avoid conflict
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Deploy Reverse Proxy configuration
      template:
        src: ./reverse-proxy.conf.j2
        dest: /etc/nginx/conf.d/reverse-proxy.conf

    - name: Restart Nginx to apply proxy settings
      service:
        name: nginx
        state: restarted